<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog — Cannabis News, Picks &amp; Culture | Lemonnade Van Nuys</title>
<meta name="description" content="Cannabis picks, weekly deals explained, hip-hop museum drops and studio stories — the Lemonnade Van Nuys blog, straight from the shop floor in Van Nuys, CA.">
<link rel="stylesheet" href="assets/style.css">
<style>
  .filter-bar{ display:flex; gap:10px; flex-wrap:wrap; padding:0 clamp(20px,5vw,64px) 30px; border-bottom:1px solid var(--line); }
  .filter-chip{ font-family:'JetBrains Mono',monospace; font-size:12px; padding:9px 16px; border-radius:20px; border:1px solid var(--line); color:var(--bone-dim); cursor:pointer; background:none; }
  .filter-chip.active{ background:var(--yellow); color:var(--ink); border-color:var(--yellow); font-weight:600; }
  .blog-page-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:26px; padding:50px clamp(20px,5vw,64px); }
  .blog-page-card{ background:var(--surface); border:1px solid var(--line); border-radius:6px; overflow:hidden; display:flex; flex-direction:column; }
  .blog-page-thumb{ aspect-ratio:16/10; background:repeating-linear-gradient(45deg, var(--surface-2) 0 10px, var(--surface) 10px 20px); display:flex; align-items:flex-end; padding:16px; }
  .blog-page-body{ padding:24px; flex:1; display:flex; flex-direction:column; }
  .blog-page-body .blog-date{ font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--bone-dim); margin-bottom:10px; }
  .blog-page-body h3{ font-family:'Bungee',sans-serif; font-size:1.15rem; text-transform:uppercase; line-height:1.3; margin-bottom:12px; }
  .blog-page-body p{ color:var(--bone-dim); font-size:13.5px; line-height:1.65; flex:1; }
  .blog-page-body .read-more{ margin-top:16px; font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--yellow); }
  @media (max-width:860px){ .blog-page-grid{ grid-template-columns:1fr; } }
</style>
<link rel="icon" type="image/x-icon" href="assets/favicon.ico">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="48x48" href="assets/favicon-48x48.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
</head>
<body>
  <div id="site">

    <section class="page-hero">
      <div class="hero-eyebrow">From The Shop Floor</div>
      <h1 class="display">The Lemonnade Blog</h1>
      <p>Museum drops, studio sessions, product picks, and what's actually good this week — straight from Van Nuys.</p>
    </section>

    <div class="filter-bar">
      <button class="filter-chip active" data-cat="all">All</button>
      <button class="filter-chip" data-cat="culture">Culture</button>
      <button class="filter-chip" data-cat="studio">Studio</button>
      <button class="filter-chip" data-cat="product">Product</button>
    </div>

    <!-- BLOG-DATA: now pulled live from Supabase -->
    <div class="blog-page-grid" id="blogGrid">
      <div class="empty-state">Loading posts…</div>
    </div>

  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/supabase-config.js"></script>
<script src="assets/supabase-client.js"></script>
<script src="assets/components.js"></script>
<script>
  mountLemonnadeSite({ activeHref: 'blog.html', logoSrc: 'assets/logo.png' });

  let allPosts = [];

  async function renderBlog() {
    const grid = document.getElementById('blogGrid');
    allPosts = await fetchBlogPosts();
    if (!allPosts.length) {
      grid.innerHTML = '<div class="empty-state">No posts yet — check back soon.</div>';
      return;
    }
    drawPosts('all');
  }

  function drawPosts(cat) {
    const grid = document.getElementById('blogGrid');
    const filtered = cat === 'all' ? allPosts : allPosts.filter(p => p.category.toLowerCase() === cat);
    grid.innerHTML = filtered.map(post => `
      <div class="blog-page-card">
        <div class="blog-page-thumb"><span class="blog-cat mono">${post.category.toUpperCase()}</span></div>
        <div class="blog-page-body">
          <span class="blog-date mono">${new Date(post.published_date + 'T00:00:00').toLocaleDateString('en-US', { month:'short', day:'2-digit', year:'numeric' }).toUpperCase()}</span>
          <h3>${post.title}</h3>
          <p>${post.excerpt}</p>
        </div>
      </div>`).join('');
  }

  document.querySelectorAll('.filter-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      drawPosts(chip.dataset.cat);
    });
  });

  renderBlog();
</script>
</body>
</html>
