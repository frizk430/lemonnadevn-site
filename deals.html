<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weekly Deals — Lemonnade Van Nuys</title>
<meta name="description" content="This week's deals at Lemonnade Van Nuys — a new deal every day of the week.">
<link rel="stylesheet" href="assets/style.css">
<style>
  .deals-detail{ padding:20px clamp(20px,5vw,64px) 80px; max-width:820px; }
  .deals-detail h2{ font-family:'Bungee',sans-serif; font-size:1.4rem; text-transform:uppercase; margin:36px 0 14px; color:var(--yellow); }
  .deals-detail h2:first-child{ margin-top:0; }
  .deals-detail ul{ list-style:none; padding:0; }
  .deals-detail li{ padding:10px 0; border-bottom:1px solid var(--line); color:var(--bone-dim); font-size:14.5px; }
  .deals-detail li:last-child{ border-bottom:none; }
  .deal-graphic{ max-width:100%; border-radius:6px; margin-bottom:14px; display:block; }
  .today-banner{
    background: linear-gradient(120deg, var(--yellow) 0%, var(--yellow-deep) 100%);
    color:var(--ink); border-radius:6px; padding:32px; margin-bottom:40px;
  }
  .today-banner .tag{
    font-family:'JetBrains Mono',monospace; font-weight:700; font-size:11px; letter-spacing:0.14em;
    background:var(--ink); color:var(--yellow); padding:8px 14px; border-radius:20px; display:inline-block; margin-bottom:14px;
  }
  .today-banner h2{ font-family:'Bungee',sans-serif; font-size:1.4rem; text-transform:uppercase; margin-bottom:14px; color:var(--ink); }
  .today-banner ul{ list-style:none; padding:0; }
  .today-banner li{ padding:8px 0; font-size:14.5px; border-bottom:1px solid rgba(10,10,10,0.15); color:var(--ink); }
  .today-banner li:last-child{ border-bottom:none; }
  .today-banner img{ max-width:100%; border-radius:6px; margin-bottom:14px; display:block; }
  .everyday-section{ margin-bottom:36px; padding-bottom:28px; border-bottom:1px solid var(--line); }
  .everyday-card{ background:var(--surface); border:1px solid var(--yellow); border-radius:6px; padding:24px; margin-bottom:12px; }
  .everyday-card .tag{ font-family:'JetBrains Mono',monospace; font-weight:700; font-size:10px; letter-spacing:0.12em; color:var(--yellow); margin-bottom:10px; display:block; }
  .everyday-card img{ max-width:100%; border-radius:6px; margin-bottom:12px; display:block; }
  .everyday-card ul{ list-style:none; padding:0; }
  .everyday-card li{ padding:8px 0; border-bottom:1px solid var(--line); color:var(--bone-dim); font-size:14.5px; }
  .everyday-card li:last-child{ border-bottom:none; }
</style>
<link rel="icon" type="image/x-icon" href="assets/favicon.ico">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="48x48" href="assets/favicon-48x48.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
</head>
<body>
  <div id="site">

    <section class="page-hero">
      <div class="hero-eyebrow">Save This Week</div>
      <h1 class="display">Weekly Deals</h1>
      <p>There's a deal every day of the week. Stop by and save on your favorite brands.</p>
    </section>

    <div class="deals-detail">
      <div id="todayContainer"></div>
      <div id="everydayContainer"></div>
      <div class="block-eyebrow" style="padding:0;">All Week's Deals</div>
      <div id="dealsContainer">
        <div class="empty-state">Loading deals…</div>
      </div>
    </div>

  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/supabase-config.js"></script>
<script src="assets/supabase-client.js"></script>
<script src="assets/components.js"></script>
<script>
  mountLemonnadeSite({ activeHref: 'deals.html', logoSrc: 'assets/logo.png' });

  async function renderDeals() {
    const container = document.getElementById('dealsContainer');
    const todayContainer = document.getElementById('todayContainer');
    const everydayContainer = document.getElementById('everydayContainer');
    const deals = await fetchDeals();
    if (!deals.length) {
      container.innerHTML = '<div class="empty-state">No deals posted right now — check back soon.</div>';
      return;
    }

    // Split out "Everyday" deals from day-specific ones
    const everydayDeals = deals.filter(d => d.day_label.toLowerCase().includes('everyday'));
    const weeklyDeals = deals.filter(d => !d.day_label.toLowerCase().includes('everyday'));

    // Highlight whichever day-specific deal matches today's day of the week
    const todayName = new Date().toLocaleDateString('en-US', { weekday: 'long' });
    const todaysDeals = weeklyDeals.filter(d => d.day_label.includes(todayName));

    if (todaysDeals.length) {
      todayContainer.innerHTML = todaysDeals.map(deal => {
        const items = deal.items.split('|').map(item => `<li>${item.trim()}</li>`).join('');
        const img = deal.image_url ? `<img src="${deal.image_url}" alt="${deal.day_label} deal">` : '';
        return `
          <div class="today-banner">
            <div class="tag mono">★ TODAY'S DEAL</div>
            <h2>${deal.day_label}</h2>
            ${img}
            <ul>${items}</ul>
          </div>`;
      }).join('');
    }

    if (everydayDeals.length) {
      everydayContainer.innerHTML = `
        <div class="everyday-section">
          <div class="block-eyebrow" style="padding:0;">Every Single Day</div>
          ${everydayDeals.map(deal => {
            const items = deal.items.split('|').map(item => `<li>${item.trim()}</li>`).join('');
            const img = deal.image_url ? `<img src="${deal.image_url}" alt="${deal.day_label} deal">` : '';
            return `
              <div class="everyday-card">
                <span class="tag">ALWAYS ON</span>
                ${img}
                <ul>${items}</ul>
              </div>`;
          }).join('')}
        </div>`;
    }

    container.innerHTML = weeklyDeals.map(deal => {
      const items = deal.items.split('|').map(item => `<li>${item.trim()}</li>`).join('');
      const img = deal.image_url ? `<img class="deal-graphic" src="${deal.image_url}" alt="${deal.day_label} deal">` : '';
      return `<h2>${deal.day_label}</h2>${img}<ul>${items}</ul>`;
    }).join('');
  }
  renderDeals();
</script>
</body>
</html>
